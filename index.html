<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log an item · Washmen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap">
<style>
:root{
  --bg:#f6f5fb; --surface:#fff; --surface-2:#f0eef8; --fg:#1b1530; --muted:#625d78; --line:#e3e0ef;
  --accent:#5b3fd9; --accent-fg:#fff; --accent-soft:#ebe6fc; --ink:#1e1446; --ink-muted:#b9b1e0; --hi:#c7f0ff;
  --ok:#1d7a4a; --ok-soft:#dcf1e4; --warn:#a4560b; --warn-soft:#fbe9d4; --danger:#b3261e;
  --display:"Plus Jakarta Sans","IBM Plex Sans",system-ui,sans-serif; --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121019; --surface:#1a1724; --surface-2:#231f31; --fg:#ece9f6; --muted:#a19bb8; --line:#302b42;
  --accent:#8a76ec; --accent-fg:#120d2b; --accent-soft:#2a2350; --ink:#0d0a1c;
  --ok:#5cc98b; --ok-soft:#173527; --warn:#f0a25a; --warn-soft:#3a2716; --danger:#f2766c; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45}
.top{background:var(--ink);color:#fff}
.top-in{max-width:760px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.mark{width:32px;height:32px;border-radius:10px;background:var(--hi);color:#1e1446;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px}
.wm{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.02em;line-height:1}
.prod{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);margin-top:3px;font-weight:600}
main{max-width:760px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left,0px)) 48px}
h1{font-family:var(--display);font-size:clamp(24px,5vw,30px);font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.intro{color:var(--muted);margin:0 0 16px}
form{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px}
.card h2{margin:0;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
.f{display:grid;gap:6px;min-width:0}
.f > label,.f > .lbl{font-weight:600;font-size:14px}
.req{color:var(--accent)}
.opt{color:var(--muted);font-weight:400;font-size:12.5px}
input[type=text],input[type=date],input:not([type]),textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.mono{font-family:var(--mono)}
textarea{min-height:84px;resize:vertical}
.f.bad input,.f.bad textarea,.f.bad .types,.f.bad .seg,.f.bad .shot{border-color:var(--danger)}
.err{color:var(--danger);font-size:13px;min-height:0}
.err:empty{display:none}
.types{display:flex;flex-wrap:wrap;gap:8px;border:1.5px solid transparent;border-radius:10px}
.chip{font:inherit;font-size:14px;padding:8px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1.5px solid transparent;border-radius:10px;max-width:360px}
.seg button{font:inherit;font-size:16px;font-weight:600;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.seg button.yes[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.seg button.no[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.note{font-size:13.5px;color:var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:8px}
.shot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1.5px dashed color-mix(in srgb,var(--accent) 50%,var(--line));border-radius:12px;padding:14px;background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.shot img{width:120px;height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.camlabel{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:16px;font-weight:700;color:var(--accent);background:var(--surface);border:1.5px solid var(--accent);padding:12px 18px;border-radius:10px}
.camlabel svg{width:20px;height:20px}
.hint{font-size:13px;color:var(--muted)}
.submit{font:inherit;font-size:17px;font-weight:700;background:var(--accent);color:var(--accent-fg);border:0;border-radius:12px;padding:15px;width:100%;cursor:pointer}
.submit:disabled{opacity:.6;cursor:wait}
.suberr{color:var(--danger);font-size:14px;text-align:center}
.suberr:empty{display:none}
.done{text-align:center;padding:36px 18px;justify-items:center}
.done .tick{width:60px;height:60px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:30px;font-weight:700}
.done h2{font-family:var(--display);font-size:24px;text-transform:none;letter-spacing:-.01em;color:var(--fg)}
.done .submit{max-width:320px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
dialog{border:0;border-radius:12px;padding:0;width:min(92vw,760px);background:var(--surface);color:var(--fg)}
dialog::backdrop{background:rgba(5,12,18,.75)}
dialog video{display:block;width:100%;max-height:70vh;background:#000}
dialog .cap{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px}
dialog .cap button{font:inherit;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
dialog .cap .go{border:0;background:var(--accent);color:var(--accent-fg);font-weight:600}
</style>
</head>
<body>
<div class="top"><div class="top-in"><span class="mark" aria-hidden="true">w</span><div><div class="wm">washmen</div><div class="prod">Item log</div></div></div></div>
<main>
  <section id="formView">
    <h1>Log an item</h1>
    <p class="intro">Fill in the details and take a picture. Fields marked <span class="req">*</span> are required.</p>
    <form id="f" novalidate autocomplete="off">
      <div class="card">
        <h2>Who and when</h2>
        <div class="row2">
          <div class="f" id="fName"><label for="tName">Your name <span class="req">*</span></label>
            <input id="tName" name="dispatcher-name-entry" placeholder="Type your name" autocomplete="off" autocorrect="off" spellcheck="false" readonly data-lpignore="true" data-form-type="other">
            <div class="err"></div></div>
          <div class="f" id="fDate"><label for="tDate">Date checked <span class="req">*</span></label>
            <input type="date" id="tDate"><div class="err"></div></div>
        </div>
      </div>

      <div class="card">
        <h2>Item</h2>
        <div class="f" id="fType"><span class="lbl" id="typeLbl">Item type <span class="req">*</span></span>
          <div class="types" id="types" role="group" aria-labelledby="typeLbl"></div>
          <input id="tOther" placeholder="Type the item type…" hidden>
          <div class="err"></div></div>
        <div class="row2">
          <div class="f" id="fColor"><label for="tColor">Colour <span class="opt">(optional)</span></label>
            <input id="tColor" list="colorList" placeholder="e.g. White, Navy" autocomplete="off" spellcheck="false"><div class="err"></div></div>
          <div class="f" id="fBrand"><label for="tBrand">Brand <span class="opt">(optional — check the label)</span></label>
            <input id="tBrand" placeholder="e.g. Zara, Ikea" autocomplete="off" spellcheck="false"><div class="err"></div></div>
        </div>
        <datalist id="colorList"><option value="White"><option value="Off-White"><option value="Black"><option value="Grey"><option value="Navy"><option value="Blue"><option value="Light Blue"><option value="Green"><option value="Red"><option value="Pink"><option value="Beige"><option value="Brown"><option value="Yellow"><option value="Purple"><option value="Orange"><option value="Multi"></datalist>
        <div class="row2">
          <div class="f" id="fQr"><label for="tQr">Item QR code <span class="req">*</span></label>
            <input id="tQr" class="mono" placeholder="Scan or type" autocapitalize="off" spellcheck="false" inputmode="text"><div class="err"></div></div>
          <div class="f" id="fRfid"><label for="tRfid">RFID code <span class="opt">(optional)</span></label>
            <input id="tRfid" class="mono" placeholder="Scan or type" autocapitalize="off" spellcheck="false"><div class="err"></div></div>
        </div>
        <div class="note" id="dup" hidden></div>
      </div>

      <div class="card">
        <h2>Status</h2>
        <div class="f" id="fRect"><span class="lbl" id="rectLbl">Was the item rectified? <span class="req">*</span></span>
          <div class="seg" role="group" aria-labelledby="rectLbl">
            <button type="button" class="yes" data-rect="Yes" aria-pressed="false">Yes</button>
            <button type="button" class="no" data-rect="No" aria-pressed="false">No</button>
          </div><div class="err"></div></div>
        <div class="f" id="fRemarks"><label for="tRemarks">Remarks <span class="opt">(optional)</span></label>
          <textarea id="tRemarks" placeholder="What was wrong and what was done"></textarea><div class="err"></div></div>
      </div>

      <div class="card">
        <h2>Picture</h2>
        <div class="f" id="fPhoto"><span class="lbl">Picture of the item <span class="req">*</span></span>
          <div class="shot">
            <img id="preview" alt="Picture of the item" hidden>
            <label for="camIn" class="camlabel" id="camBtn" role="button" tabindex="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span id="camText">Take picture</span></label>
            <input type="file" id="camIn" accept="image/*" capture="environment" hidden>
            <span class="hint" id="camHint">Opens your camera.</span>
          </div><div class="err"></div></div>
      </div>

      <div class="suberr" id="subErr" role="alert"></div>
      <button type="submit" class="submit" id="submitBtn">Submit</button>
    </form>
  </section>

  <section id="doneView" class="card done" hidden>
    <div class="tick" aria-hidden="true">✓</div>
    <h2>Item logged</h2>
    <p class="hint" id="doneText" style="margin:0"></p>
    <button type="button" class="submit" id="again">Log another item</button>
  </section>
</main>
<dialog id="camDlg"><video id="video" autoplay playsinline muted></video><div class="cap"><button type="button" id="camCancel">Cancel</button><button type="button" class="go" id="snap">Capture photo</button></div></dialog>

<script>
// Paste your Apps Script Web app URL (ends in /exec) between the quotes.
var API_URL = 'https://script.google.com/macros/s/AKfycbxZVnue_GFhhEG0MQMjfdVFzVBNtFdQz0G-CpjvmdRwSwBlbTthn1M3nx7kFc1ZVg6Llg/exec';

(function(){
  var $ = function(id){ return document.getElementById(id); };
  function call(fn, arg){
    if(window.google && google.script && google.script.run){
      return new Promise(function(res, rej){ google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](arg); });
    }
    if(!/^https:\/\/script\.google\.com\//.test(API_URL)) return Promise.reject(new Error('The form is not connected yet (API_URL is missing).'));
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, arg: arg }) })
      .then(function(r){ return r.json(); })
      .then(function(j){ if(!j.ok) throw new Error(j.error || 'Request failed.'); return j.result; });
  }
  var S = { type: '', other: false, rect: '', photo: null, busy: false };
  var TYPES = ['Shirt','T-shirt','Trousers','Suit','Dress','Abaya','Kandura','Bedsheet','Pillowcase','Towel','Curtain','Shoes','Bag','Other'];
  function today(){ var d = new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }
  function setErr(id, t){ var f = $(id); f.classList.toggle('bad', !!t); f.querySelector('.err').textContent = t || '';
    if(!t && !document.querySelector('.f.bad') && /highlighted/.test($('subErr').textContent)) $('subErr').textContent = ''; }

  // Name always starts empty: no saved name, no browser autofill
  try { localStorage.removeItem('dispatcherName'); } catch(e) {}
  var nameTyped = false;
  $('tName').value = '';
  $('tName').addEventListener('focus', function(){ this.removeAttribute('readonly'); });
  $('tName').addEventListener('pointerdown', function(){ this.removeAttribute('readonly'); });
  $('tName').addEventListener('keydown', function(){ nameTyped = true; });
  function clearAutofill(){ if(!nameTyped) $('tName').value = ''; }
  [100, 600, 1500].forEach(function(ms){ setTimeout(clearAutofill, ms); });
  window.addEventListener('pageshow', function(){ nameTyped = false; $('tName').value = ''; });
  $('tDate').value = today();

  // Item type chips
  TYPES.forEach(function(t){
    var b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = t; b.dataset.type = t; b.setAttribute('aria-pressed','false');
    b.onclick = function(){
      [].forEach.call(document.querySelectorAll('#types .chip'), function(c){ c.setAttribute('aria-pressed', c === b); });
      S.other = t === 'Other'; S.type = S.other ? '' : t; $('tOther').hidden = !S.other; if(S.other) $('tOther').focus();
      setErr('fType', '');
    };
    $('types').appendChild(b);
  });
  function typeValue(){ return S.other ? $('tOther').value.trim() : S.type; }

  // Rectified
  [].forEach.call(document.querySelectorAll('[data-rect]'), function(b){ b.onclick = function(){
    S.rect = b.dataset.rect; [].forEach.call(document.querySelectorAll('[data-rect]'), function(c){ c.setAttribute('aria-pressed', c === b); }); setErr('fRect', '');
  }; });

  // Enter moves to the next field (scanners send Enter after a code)
  var order = ['tName','tDate','tColor','tBrand','tQr','tRfid','tRemarks'];
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Enter' || $('camDlg').open) return;
    var t = e.target;
    if(t.id === 'camBtn'){ e.preventDefault(); t.click(); return; }
    if(t.tagName === 'TEXTAREA' || t.tagName === 'BUTTON') return;
    if(t.tagName === 'INPUT'){ e.preventDefault(); var i = order.indexOf(t.id); if(t.id === 'tOther') i = order.indexOf('tColor') - 1;
      var n = order[i + 1]; if(n) $(n).focus(); else $('camBtn').focus(); }
  });
  ['tName','tDate','tQr','tOther'].forEach(function(id){ $(id).addEventListener('input', function(){ setErr(id === 'tOther' ? 'fType' : 'f' + id.slice(1), ''); }); });

  // Already-logged QR check
  var qrT;
  $('tQr').addEventListener('input', function(){
    clearTimeout(qrT); $('dup').hidden = true; var v = this.value.trim(); if(!v) return;
    qrT = setTimeout(function(){
      call('checkQr', v).then(function(hit){
        if(!hit || $('tQr').value.trim() !== v) return;
        $('dup').textContent = 'This QR was already logged on ' + hit.date + ' (' + hit.type + ', rectified: ' + hit.rectified + '). You can still log it again.';
        $('dup').hidden = false;
      }).catch(function(){});
    }, 600);
  });

  // Picture: phone camera natively; PC tries the webcam, else the file picker
  function isPhone(){ return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || ((navigator.maxTouchPoints || 0) > 0 && matchMedia('(pointer:coarse)').matches); }
  function setPhoto(fileOrBlob){
    var url = URL.createObjectURL(fileOrBlob), img = new Image();
    img.onload = function(){
      var s = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      S.photo = c.toDataURL('image/jpeg', 0.8);
      // Small thumbnail stored in the Sheet so the dashboard can show it
      var ts = Math.min(1, 120 / Math.max(img.width, img.height)), t = document.createElement('canvas');
      t.width = Math.max(1, Math.round(img.width * ts)); t.height = Math.max(1, Math.round(img.height * ts));
      t.getContext('2d').drawImage(img, 0, 0, t.width, t.height); S.thumb = t.toDataURL('image/jpeg', 0.6);
      $('preview').src = S.photo; $('preview').hidden = false; $('camText').textContent = 'Retake picture'; $('camHint').textContent = 'Picture added.'; setErr('fPhoto', '');
    };
    img.onerror = function(){ setErr('fPhoto', 'That file could not be read as an image. Try again.'); };
    img.src = url;
  }
  var stream = null;
  function stopCam(){ if(stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; } }
  $('camDlg').addEventListener('close', stopCam);
  $('camCancel').onclick = function(){ $('camDlg').close(); };
  $('snap').onclick = function(){
    var v = $('video'); if(!v.videoWidth) return;
    var c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight; c.getContext('2d').drawImage(v, 0, 0);
    c.toBlob(function(b){ $('camDlg').close(); if(b) setPhoto(b); $('submitBtn').focus(); }, 'image/jpeg', 0.85);
  };
  $('camBtn').addEventListener('keydown', function(e){ if(e.key === ' '){ e.preventDefault(); $('camBtn').click(); } });
  $('camBtn').addEventListener('click', function(e){
    $('camIn').value = '';
    if(isPhone() || !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) return;
    e.preventDefault();
    navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 } }, audio: false }).then(function(s){
      stream = s; $('video').srcObject = s; $('camDlg').showModal();
    }).catch(function(){
      setErr('fPhoto', 'The webcam could not be opened. Allow camera access in the browser (camera icon in the address bar), or choose a photo instead.');
      $('camIn').click();
    });
  });
  $('camIn').onchange = function(e){ var f = e.target.files[0]; if(f) setPhoto(f); };

  // Submit
  function validate(){
    var errs = [];
    if(!$('tName').value.trim()) errs.push(['fName', 'Type your name.']);
    if(!$('tDate').value) errs.push(['fDate', 'Pick a date.']);
    if(!typeValue()) errs.push(['fType', S.other ? 'Type the item type.' : 'Pick the item type.']);
    if(!$('tQr').value.trim()) errs.push(['fQr', 'Scan or type the QR code.']);
    if(!S.rect) errs.push(['fRect', 'Choose Yes or No.']);
    if(!S.photo) errs.push(['fPhoto', 'Take a picture of the item.']);
    ['fName','fDate','fType','fQr','fRect','fPhoto'].forEach(function(id){ setErr(id, ''); });
    errs.forEach(function(x){ setErr(x[0], x[1]); });
    return errs;
  }
  $('f').addEventListener('submit', function(e){
    e.preventDefault(); if(S.busy) return;
    $('subErr').textContent = '';
    var errs = validate();
    if(errs.length){ $('subErr').textContent = 'Please fill in the highlighted fields.'; $(errs[0][0]).scrollIntoView({behavior:'smooth', block:'center'}); return; }
    S.busy = true; $('submitBtn').disabled = true; $('submitBtn').textContent = 'Submitting…';
    var data = { name: $('tName').value.trim(), date: $('tDate').value, itemType: typeValue(), brand: $('tBrand').value.trim(), color: $('tColor').value.trim(), qr: $('tQr').value.trim(),
      rfid: $('tRfid').value.trim(), rectified: S.rect, remarks: $('tRemarks').value.trim(), photo: S.photo, thumb: S.thumb || '' };
    call('submitItem', data).then(function(){
      $('doneText').textContent = 'Thanks, ' + data.name + '. ' + data.itemType + ' · ' + data.qr + ' is now in the log.';
      $('formView').hidden = true; $('doneView').hidden = false; window.scrollTo(0, 0); $('again').focus();
    }).catch(function(x){
      $('subErr').textContent = (x && x.message ? x.message : 'Could not submit.') + ' Check your connection and press Submit again.';
    }).then(function(){ S.busy = false; $('submitBtn').disabled = false; $('submitBtn').textContent = 'Submit'; });
  });

  // Log another item: everything cleared, including the name
  $('again').onclick = function(){
    S.type = ''; S.other = false; S.rect = ''; S.photo = null; S.thumb = ''; nameTyped = false;
    ['tName','tColor','tBrand','tQr','tRfid','tRemarks','tOther'].forEach(function(id){ $(id).value = ''; });
    $('tDate').value = today(); $('tOther').hidden = true; $('preview').hidden = true; $('dup').hidden = true;
    $('camText').textContent = 'Take picture'; $('camHint').textContent = 'Opens your camera.'; $('camIn').value = '';
    [].forEach.call(document.querySelectorAll('[aria-pressed]'), function(c){ c.setAttribute('aria-pressed','false'); });
    $('doneView').hidden = true; $('formView').hidden = false; window.scrollTo(0, 0);
  };
})();
</script>
</body>
</html>
